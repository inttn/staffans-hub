<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Jarskog utomhuskök — Interaktiv 3D-modell</title>
<style>
  body { margin: 0; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; background: #1a1a1c; color: #f6f1e1; }
  #controls { position: fixed; top: 16px; left: 16px; background: rgba(20,18,16,0.92); padding: 14px 18px; border-radius: 8px; font-size: 13px; z-index: 10; min-width: 220px; backdrop-filter: blur(8px); }
  #controls h3 { margin: 0 0 8px; font-size: 14px; color: #f6f1e1; font-weight: 600; }
  #controls label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; user-select: none; }
  #controls input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
  #controls .section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #444; }
  #controls button { width: 100%; padding: 6px 10px; background: #c9c1b1; color: #2a2520; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 4px; font-weight: 600; }
  #controls button:hover { background: #f6f1e1; }
  #info { position: fixed; top: 16px; right: 16px; background: rgba(20,18,16,0.92); padding: 14px 18px; border-radius: 8px; font-size: 12px; z-index: 10; max-width: 320px; backdrop-filter: blur(8px); }
  #info h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  #info p { margin: 4px 0; color: #c9c1b1; }
  #info .key { background: #444; padding: 1px 6px; border-radius: 3px; font-family: Menlo, Monaco, monospace; font-size: 11px; }
  #orientation { position: fixed; bottom: 16px; left: 16px; background: rgba(20,18,16,0.85); padding: 8px 14px; border-radius: 6px; font-size: 11px; color: #c9c1b1; }
  .dim-label {
    background: rgba(255, 255, 248, 0.96);
    border: 1px solid #888;
    padding: 1px 6px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 10px;
    color: #1a1a1c;
    border-radius: 3px;
    pointer-events: none;
    white-space: nowrap;
    font-weight: 500;
  }
  .dim-label.cat-total { background: rgba(255, 240, 220, 0.96); border-color: #c5824a; color: #5a2a08; }
  .dim-label.cat-layout { background: rgba(220, 240, 255, 0.96); border-color: #4a72c5; color: #08245a; }
  .dim-label.cat-luckor { background: rgba(240, 240, 240, 0.96); border-color: #666; color: #1a1a1a; }
  .dim-label.cat-apparat { background: rgba(255, 245, 220, 0.96); border-color: #c5a44a; color: #5a4408; }
  .dim-label.cat-stomme { background: rgba(220, 255, 230, 0.96); border-color: #4ac572; color: #084a2a; }
</style>
</head>
<body>

<div id="controls">
  <h3>Visa / dölj</h3>
  <label><input type="checkbox" id="show-stomme" checked> Stomme (KKR)</label>
  <label><input type="checkbox" id="show-cementskiva" checked> Cementskiva + microcement</label>
  <label><input type="checkbox" id="show-bank" checked> Bänkskiva</label>
  <label><input type="checkbox" id="show-luckor" checked> 4 Luckor (lamellfasad)</label>
  <label><input type="checkbox" id="show-grill" checked> Grill BIG32</label>
  <label><input type="checkbox" id="show-sizzler" checked> Sizzler BIB10IR</label>
  <label><input type="checkbox" id="show-trall" checked> Trall (golv)</label>
  <label><input type="checkbox" id="show-heatshield" checked> Värmesköld (under sizzler)</label>
  <label><input type="checkbox" id="show-gasol" checked> Gasolflaskor (2× P11)</label>
  <label><input type="checkbox" id="show-husvagg" checked> Husvägg (vänster sida)</label>
  <label><input type="checkbox" id="show-cutout" checked> Cutout-ram (visa hål i bänk)</label>
  <label><input type="checkbox" id="show-llist" checked> L-list rostfri (utan ZCL)</label>
  <label><input type="checkbox" id="show-zcl"> ZCL — Zero Clearance Liner (alternativ till L-list)</label>
  <div class="section">
    <h3>Mått (visa/dölj)</h3>
    <label><input type="checkbox" id="dim-total"> Total mått (LxDxH)</label>
    <label><input type="checkbox" id="dim-layout"> Layout (skåp/svävande/gavel)</label>
    <label><input type="checkbox" id="dim-luckor"> Luckor (4 st)</label>
    <label><input type="checkbox" id="dim-apparat"> Apparater (cutout + höjd)</label>
    <label><input type="checkbox" id="dim-stomme"> Stomme (stolpar + tvärbalkar)</label>
  </div>
  <div class="section">
    <h3>Kamera</h3>
    <button onclick="resetCamera('iso')">Isometrisk</button>
    <button onclick="resetCamera('front')">Framifrån (lamellfasad)</button>
    <button onclick="resetCamera('back')">Bakifrån (mot uthus)</button>
    <button onclick="resetCamera('top')">Uppifrån</button>
    <button onclick="resetCamera('right')">Höger (gavel)</button>
    <button onclick="resetCamera('left')">Vänster (mot husvägg)</button>
  </div>
</div>

<div id="info">
  <h2>Jarskog utomhuskök</h2>
  <p><strong>3 300 × 700 × 870 mm</strong></p>
  <p>Layout från VÄNSTER (uthus-vägg) → HÖGER (trädgård):</p>
  <p>sizzler · grill · bänkyta · svävande bänkdel · gavel</p>
  <p style="margin-top: 10px;">
    <span class="key">drag</span> rotera<br>
    <span class="key">scroll</span> zoom<br>
    <span class="key">höger-drag</span> pan
  </p>
</div>

<div id="orientation">Standard 3D-konvention: +X höger, +Y upp, +Z mot dig (framsida)</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c4d4);
scene.fog = new THREE.Fog(0xb8c4d4, 8, 30);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// CSS2D renderer for dimension labels
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Lighting
scene.add(new THREE.HemisphereLight(0xa8c0d8, 0x66543a, 0.6));
const sun = new THREE.DirectionalLight(0xfff2d0, 2.0);
sun.position.set(4, 8, 5);  // upper-right-front
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -3;
sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 25;
sun.shadow.bias = -0.001;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0xa0b0c8, 0.35).translateX(-3));

// Materials
const matSteel = new THREE.MeshStandardMaterial({color: 0x14141a, roughness: 0.45, metalness: 0.5});
const matStainless = new THREE.MeshStandardMaterial({color: 0xb4b4b8, roughness: 0.22, metalness: 0.92});
const matGrillBody = new THREE.MeshStandardMaterial({color: 0x383840, roughness: 0.3, metalness: 0.75});
const matGrillLid = new THREE.MeshStandardMaterial({color: 0x0e0e10, roughness: 0.28, metalness: 0.5});
const matWood = new THREE.MeshStandardMaterial({color: 0x5a4e30, roughness: 0.7, metalness: 0.0});
const matMicrocement = new THREE.MeshStandardMaterial({color: 0xc8c0aa, roughness: 0.88, metalness: 0.0});
const matCementskiva = new THREE.MeshStandardMaterial({color: 0xa8a297, roughness: 0.92, metalness: 0.0});
const matTrall = new THREE.MeshStandardMaterial({color: 0x6e5a3a, roughness: 0.85, metalness: 0.0});
const matHeatshield = new THREE.MeshStandardMaterial({color: 0xc8c8cc, roughness: 0.25, metalness: 0.9, side: THREE.DoubleSide});
const matGasol = new THREE.MeshStandardMaterial({color: 0xa83a2c, roughness: 0.55, metalness: 0.1});
const matGasolValve = new THREE.MeshStandardMaterial({color: 0xa8a8a8, roughness: 0.4, metalness: 0.7});
const matHusvagg = new THREE.MeshStandardMaterial({color: 0xe8dec8, roughness: 0.9, metalness: 0.0});
const matLList = new THREE.MeshStandardMaterial({color: 0xc8c8d0, roughness: 0.15, metalness: 0.95});
const matZCL = new THREE.MeshStandardMaterial({color: 0xa8a8b2, roughness: 0.2, metalness: 0.85, side: THREE.DoubleSide});
const matCutout = new THREE.MeshStandardMaterial({color: 0xe06030, roughness: 0.4, metalness: 0.0, emissive: 0x401008, emissiveIntensity: 0.3});

const root = new THREE.Group();
scene.add(root);
root.scale.setScalar(0.001);

// ==============================================================
// COORDINATE MAPPING — FIXED to standard Three.js conventions
// SCAD: x=length(0=vänster, 3300=höger), y=djup(0=front, 700=back), z=height(0=trall, 800=topp_stomme)
// Three.js: x=length (same direction), y=up (same as scad_z), z=DEPTH (negated from scad_y)
// 
// Why negate y: in standard Three.js, +Z is TOWARD viewer (out of screen).
// SCAD y=0 (front of kitchen, lamellfasad side) should be CLOSEST to viewer = three z=0 or slightly positive.
// SCAD y=700 (back, uthus-vägg side) should be INTO screen = three z=-0.7 (negative).
// SCAD y=-23 (lamellfasad in front) → three z=+0.023 (toward viewer).
// ==============================================================
function box(x1, y1, z1, x2, y2, z2, mat, group, castShadow=true, receiveShadow=true) {
  const w = x2 - x1, d = y2 - y1, h = z2 - z1;
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat);
  // Three.js coords: x = scad x, y = scad z (up), z = -(scad y) (negated for standard convention)
  m.position.set((x1+x2)/2, (z1+z2)/2, -(y1+y2)/2);
  m.castShadow = castShadow;
  m.receiveShadow = receiveShadow;
  group.add(m);
  return m;
}

// Constants (in scad coords)
const PROFILE = 40;
const TOTAL_L = 3300;
const DEPTH = 700;
const STOMME_H = 800;
const BANK_H = 70;
const SKAP_L = 1905;
const GAVEL_X = 3225;
const GAVEL_W = 75;
const GAVEL_STOLPE_X = 3242;

// Groups
const groupStomme = new THREE.Group();
const groupCementskiva = new THREE.Group();
const groupBank = new THREE.Group();
const groupLuckor = new THREE.Group();
const groupGrill = new THREE.Group();
const groupSizzler = new THREE.Group();
const groupTrall = new THREE.Group();
const groupHeatshield = new THREE.Group();
const groupGasol = new THREE.Group();
const groupHusvagg = new THREE.Group();
const groupLList = new THREE.Group();
const groupZCL = new THREE.Group();
const groupCutout = new THREE.Group();        // cutout-ram utan ZCL (762×502)
const groupCutoutZCL = new THREE.Group();     // cutout-ram med ZCL (864×543)
root.add(groupStomme, groupCementskiva, groupBank, groupLuckor, groupGrill, groupSizzler, groupTrall, groupHeatshield, groupGasol, groupHusvagg, groupLList, groupZCL, groupCutout, groupCutoutZCL);

// === STOMME ===
const stolpareXR = [40, 483, 914, 1905];
for (const xr of stolpareXR) {
  box(xr - PROFILE, 0, 0, xr, PROFILE, STOMME_H, matSteel, groupStomme);
  box(xr - PROFILE, DEPTH - PROFILE, 0, xr, DEPTH, STOMME_H, matSteel, groupStomme);
}
// EXTRA stolpe vid x=1676 (höger om grill) för att stötta nedsänkta framsida-balken
// och högra cutout-kanten — vänster om grillen finns stolpe vid x=874..914
box(1676, 0, 0, 1716, PROFILE, STOMME_H, matSteel, groupStomme);  // front
box(1676, DEPTH - PROFILE, 0, 1716, DEPTH, STOMME_H, matSteel, groupStomme);  // back
box(GAVEL_STOLPE_X, 0, 0, GAVEL_STOLPE_X + PROFILE, PROFILE, STOMME_H, matSteel, groupStomme);
box(GAVEL_STOLPE_X, DEPTH - PROFILE, 0, GAVEL_STOLPE_X + PROFILE, DEPTH, STOMME_H, matSteel, groupStomme);
// Framsida-balk vid bänkyta-nivå: BRUTEN i grill-zonen (öppen framtill för grill-insättning)
box(0, 0, STOMME_H - PROFILE, 914, PROFILE, STOMME_H, matSteel, groupStomme);  // vänster del z=760..800
box(1676, 0, STOMME_H - PROFILE, TOTAL_L, PROFILE, STOMME_H, matSteel, groupStomme);  // höger del z=760..800
// NEDSÄNKT framsida-balk i grill-zonen (under grill-body-bottenytan vid z=610)
// Ger strukturell kontinuitet utan att blockera grillens nedsänkning
box(914, 0, 570, 1676, PROFILE, 610, matSteel, groupStomme);  // lowered KKR z=570..610 (top vid grill-body-botten)
// (Vertikala anslutningar BORTTAGNA — stolparna vid x=874..914 och x=1676..1716
//  går redan full höjd och möter den nedsänkta balken direkt vid z=570..610)

box(0, DEPTH - PROFILE, STOMME_H - PROFILE, TOTAL_L, DEPTH, STOMME_H, matSteel, groupStomme);  // baksida-balk kontinuerlig
box(0, PROFILE, STOMME_H - PROFILE, PROFILE, DEPTH - PROFILE, STOMME_H, matSteel, groupStomme);
const tvarbalkPositions = [[189,229],[483,523],[874,914],[1676,1716],[1865,1905],[2545,2585],[3242,3282]];
for (const [x1, x2] of tvarbalkPositions) box(x1, PROFILE, STOMME_H - PROFILE, x2, DEPTH - PROFILE, STOMME_H, matSteel, groupStomme);
const midBalkSegs = [[40,189],[523,874],[1716,1865],[1905,2545],[2585,3242]];
for (const [x1, x2] of midBalkSegs) box(x1, 330, STOMME_H - PROFILE, x2, 370, STOMME_H, matSteel, groupStomme);
box(229, 80, STOMME_H-PROFILE, 483, 120, STOMME_H, matSteel, groupStomme);
box(229, 596, STOMME_H-PROFILE, 483, 636, STOMME_H, matSteel, groupStomme);
// Grill front frame TAGEN BORT (cutout öppen i front)
box(914, 502, STOMME_H-PROFILE, 1676, 542, STOMME_H, matSteel, groupStomme);  // grill back frame (flyttad från y=552 till y=502)
box(0, 0, 0, SKAP_L, PROFILE, PROFILE, matSteel, groupStomme);
box(0, DEPTH - PROFILE, 0, SKAP_L, DEPTH, PROFILE, matSteel, groupStomme);
box(0, PROFILE, 0, PROFILE, DEPTH - PROFILE, PROFILE, matSteel, groupStomme);
box(SKAP_L - PROFILE, PROFILE, 0, SKAP_L, DEPTH - PROFILE, PROFILE, matSteel, groupStomme);
for (const [x1, x2] of [[443, 483], [874, 914]]) box(x1, PROFILE, 0, x2, DEPTH - PROFILE, PROFILE, matSteel, groupStomme);
box(GAVEL_STOLPE_X, 0, 0, GAVEL_STOLPE_X + PROFILE, DEPTH, PROFILE, matSteel, groupStomme);

// === CEMENTSKIVA ===
box(0, DEPTH - 17.5, 0, SKAP_L, DEPTH, STOMME_H, matMicrocement, groupCementskiva);
box(SKAP_L - 17.5, 0, 0, SKAP_L, DEPTH, STOMME_H, matMicrocement, groupCementskiva);
box(0, 0, 0, 12.5, DEPTH, STOMME_H, matCementskiva, groupCementskiva);
box(GAVEL_X, 0, 0, GAVEL_X + GAVEL_W, DEPTH, STOMME_H + BANK_H, matMicrocement, groupCementskiva);
box(SKAP_L, 0, STOMME_H - 17.5, GAVEL_X, DEPTH, STOMME_H, matMicrocement, groupCementskiva);

// === BÄNKSKIVA (with cutouts) ===
// Grill cutout: U-formad, OPEN at front (extends from y=0 = bänk-front to y=502)
// Sizzler cutout: rectangle (closed all sides) at y=120..596
box(0, 0, STOMME_H, 229, DEPTH, STOMME_H + BANK_H, matMicrocement, groupBank);
box(229, 0, STOMME_H, 483, 120, STOMME_H + BANK_H, matMicrocement, groupBank);
box(229, 596, STOMME_H, 483, 700, STOMME_H + BANK_H, matMicrocement, groupBank);
box(483, 0, STOMME_H, 914, DEPTH, STOMME_H + BANK_H, matMicrocement, groupBank);
// NO front strip for grill — cutout extends to bänk-front edge (y=0)
box(914, 502, STOMME_H, 1676, 700, STOMME_H + BANK_H, matMicrocement, groupBank);  // back strip y=502..700
box(1676, 0, STOMME_H, GAVEL_X, DEPTH, STOMME_H + BANK_H, matMicrocement, groupBank);

// === LUCKOR (4 st med lamellfasad) ===
const luckaPositions = [
  {x1: 0, x2: 483, name: 'lucka1', under_grill: false},
  {x1: 483, x2: 914, name: 'lucka2', under_grill: false},
  {x1: 914, x2: 1414, name: 'lucka3', under_grill: true},   // under grill — kortare
  {x1: 1414, x2: 1676, name: 'lucka4', under_grill: true},  // helt under grill — kortare, slutar vid stolpe 1676
];
const LUCKA_Y_OFFSET = -5;
const LUCKA_TOP_FULL = STOMME_H - 30;  // = 770 (för luckor utan grill ovanför)
const LUCKA_TOP_SHORT = 580;            // 580 = 30 mm säkerhetsmargin under grill body botten (z=610)
const LUCKA_BOT = 30;
const LAMELL_W = 28;
const LAMELL_T = 18;
const LAMELL_GAP = 8;
const LAMELL_STEP = LAMELL_W + LAMELL_GAP;

for (const l of luckaPositions) {
  const lucka_top = l.under_grill ? LUCKA_TOP_SHORT : LUCKA_TOP_FULL;
  const margin = 10;
  box(l.x1 + margin, LUCKA_Y_OFFSET - 3, LUCKA_BOT, l.x2 - margin, LUCKA_Y_OFFSET, lucka_top, matSteel, groupLuckor);
  const innerW = (l.x2 - l.x1) - 2 * margin - LAMELL_GAP;
  const n = Math.floor(innerW / LAMELL_STEP);
  const startX = l.x1 + margin + ((l.x2 - l.x1 - 2 * margin) - (n * LAMELL_STEP - LAMELL_GAP)) / 2;
  for (let i = 0; i < n; i++) {
    const lx1 = startX + i * LAMELL_STEP;
    box(lx1, LUCKA_Y_OFFSET - LAMELL_T, LUCKA_BOT, lx1 + LAMELL_W, LUCKA_Y_OFFSET, lucka_top, matWood, groupLuckor);
  }
}

// === FIXED LAMELLFASAD-PANEL (ingen dörr, bara ribbor) vid x=1676..1905 ===
// Höger del av skåpet där det inte finns någon lucka (för att luckor 3+4 är kortare)
// Bara ribbor som täcker hela höjden — dödt utrymme bakom (no access)
const fixed_panel_x1 = 1676;
const fixed_panel_x2 = 1905;
const fixed_panel_top = LUCKA_TOP_FULL;  // full height z=30..770
const fixed_panel_margin = 10;
const fixed_panel_inner_w = (fixed_panel_x2 - fixed_panel_x1) - 2 * fixed_panel_margin - LAMELL_GAP;
const fixed_panel_n = Math.floor(fixed_panel_inner_w / LAMELL_STEP);
const fixed_panel_start_x = fixed_panel_x1 + fixed_panel_margin + ((fixed_panel_x2 - fixed_panel_x1 - 2 * fixed_panel_margin) - (fixed_panel_n * LAMELL_STEP - LAMELL_GAP)) / 2;
// Backing (steel mounting plate)
box(fixed_panel_x1 + fixed_panel_margin, LUCKA_Y_OFFSET - 3, LUCKA_BOT, fixed_panel_x2 - fixed_panel_margin, LUCKA_Y_OFFSET, fixed_panel_top, matSteel, groupLuckor);
// Ribbor (lamellfasad strips, full height — no door, just decoration)
for (let i = 0; i < fixed_panel_n; i++) {
  const lx1 = fixed_panel_start_x + i * LAMELL_STEP;
  box(lx1, LUCKA_Y_OFFSET - LAMELL_T, LUCKA_BOT, lx1 + LAMELL_W, LUCKA_Y_OFFSET, fixed_panel_top, matWood, groupLuckor);
}

// === GRILL BIG32 — VERIFIED PER OWNER'S MANUAL SIDA 6 ===
// Cutout in bänkskiva = RAK rektangel W × D = 762 × 502 (per manual)
// Grill body above bänk: X × D = 851 × 502 (flange overhang 44mm per side)
// Knobs on FRONT face of above-bench body, NOT hanging below bänk
// Drop-in firebox below: 762 × 502, depth ~130mm into cabinet
const GC = [914, 0, 1676, 502];  // U-formad cutout, OPEN at front (y=0 = bänk-front)

// Flange dimensions (X = 851 mm wide, slight overhang front/back)
const FLANGE_W_EXTRA = 45;  // (851 - 762)/2 = 44.5 mm each side
const FLANGE_Y_EXTRA = 5;   // slight front/back overhang
const FX1 = GC[0] - FLANGE_W_EXTRA;     // 869
const FX2 = GC[2] + FLANGE_W_EXTRA;     // 1721
const FY1 = GC[1] - FLANGE_Y_EXTRA;     // 45
const FY2 = GC[3] + FLANGE_Y_EXTRA;     // 557
const Z_BENCH_TOP = STOMME_H + BANK_H;  // 870

// Above-bench body (with knobs section integrated at bottom)
const KNOBS_SECTION_H = 60;   // bottom 60 mm has knobs
const LID_H = 260;            // lid 260 mm tall
// Body lower section (with knobs)
box(FX1, FY1, Z_BENCH_TOP, FX2, FY2, Z_BENCH_TOP + KNOBS_SECTION_H, matGrillBody, groupGrill);
// Lid (slightly smaller)
box(FX1 + 5, FY1 + 5, Z_BENCH_TOP + KNOBS_SECTION_H, FX2 - 5, FY2 - 5, Z_BENCH_TOP + KNOBS_SECTION_H + LID_H, matGrillLid, groupGrill);
// Lid handle on front
box(FX1 + 250, FY1 - 25, Z_BENCH_TOP + KNOBS_SECTION_H + LID_H - 80, FX2 - 250, FY1, Z_BENCH_TOP + KNOBS_SECTION_H + LID_H - 55, matStainless, groupGrill);

// 4 burner knobs on FRONT face of body (integrated, NOT hanging below bänk)
for (let i = 0; i < 4; i++) {
  const knobX = FX1 + (FX2 - FX1) * (0.18 + i * 0.215);
  const knobGeo = new THREE.CylinderGeometry(14, 14, 18, 24);
  const knob = new THREE.Mesh(knobGeo, matSteel);
  // Position on FRONT face of body (at y=FY1, sticking out forward)

// Visar cutout-perimeter på bänkytan så man ser cutoutet även när grillen är på plats.
// Två varianter: utan ZCL (762×502) och med ZCL (864×543)
function addCutoutFrame(cx_x1, cx_y1, cx_x2, cx_y2, depth, group, openFront) {
  // openFront = true → no front wall (cutout extends to bänk-front edge for grill+control panel)
  // depth = H from manual (260mm for grill, 152mm for sizzler) — clearance needed BELOW bänkyta
  // hasControlPanel = true → adds a forward-extending notch where the control panel drops down
  const T = 3;            // wall outline thickness
  const RIM = 6;          // top rim width
  const bench_top = STOMME_H + BANK_H;
  const cutout_bot = bench_top - depth;
  
  // === Vertical wall outlines going DOWN ===
  // Front wall — SKIP if openFront (cutout extends to bänk-front, no wall there)
  if (!openFront) {
    box(cx_x1, cx_y1 - T, cutout_bot, cx_x2, cx_y1, bench_top, matCutout, group);
  }
  // Back wall
  box(cx_x1, cx_y2, cutout_bot, cx_x2, cx_y2 + T, bench_top, matCutout, group);
  // Left wall
  box(cx_x1 - T, cx_y1 - T, cutout_bot, cx_x1, cx_y2 + T, bench_top, matCutout, group);
  // Right wall
  box(cx_x2, cx_y1 - T, cutout_bot, cx_x2 + T, cx_y2 + T, bench_top, matCutout, group);
  
  // === Top rim on bänkyta (around cutout perimeter, U-shape if openFront) ===
  if (!openFront) {
    box(cx_x1 - RIM, cx_y1 - RIM, bench_top + 1, cx_x2 + RIM, cx_y1 - T, bench_top + 2, matCutout, group);
  }
  box(cx_x1 - RIM, cx_y2 + T, bench_top + 1, cx_x2 + RIM, cx_y2 + RIM, bench_top + 2, matCutout, group);
  box(cx_x1 - RIM, cx_y1 - T, bench_top + 1, cx_x1 - T, cx_y2 + T, bench_top + 2, matCutout, group);
  box(cx_x2 + T, cx_y1 - T, bench_top + 1, cx_x2 + RIM, cx_y2 + T, bench_top + 2, matCutout, group);
  
  // === Bottom rim at cutout floor ===
  if (!openFront) {
    box(cx_x1 - T, cx_y1 - T, cutout_bot - 2, cx_x2 + T, cx_y1, cutout_bot, matCutout, group);
  }
  box(cx_x1 - T, cx_y2, cutout_bot - 2, cx_x2 + T, cx_y2 + T, cutout_bot, matCutout, group);
  box(cx_x1 - T, cx_y1, cutout_bot - 2, cx_x1, cx_y2, cutout_bot, matCutout, group);
  box(cx_x2, cx_y1, cutout_bot - 2, cx_x2 + T, cx_y2, cutout_bot, matCutout, group);
}

// Convert scad coords [x,y,z] in mm to three.js Vector3 (with negated y → -z mapping)
function scadV(x, y, z) {
  return new THREE.Vector3(x, z, -y);
}

// Add a dimension between two scad points, with offset direction
// offsetVec: scad offset [dx, dy, dz] in mm
function addDim(scadP1, scadP2, label, group, offsetVec, cat='') {
  const p1 = new THREE.Vector3(scadP1[0], scadP1[1], scadP1[2]);
  const p2 = new THREE.Vector3(scadP2[0], scadP2[1], scadP2[2]);
  const off = new THREE.Vector3(offsetVec[0], offsetVec[1], offsetVec[2]);
  const p1off = p1.clone().add(off);
  const p2off = p2.clone().add(off);
  
  // Convert to three.js coords
  const tp1 = scadV(p1.x, p1.y, p1.z);
  const tp2 = scadV(p2.x, p2.y, p2.z);
  const tp1off = scadV(p1off.x, p1off.y, p1off.z);
  const tp2off = scadV(p2off.x, p2off.y, p2off.z);
  
  // Extension lines + dim line
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([tp1, tp1off]), dimLineMat));
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([tp2, tp2off]), dimLineMat));
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([tp1off, tp2off]), dimLineMat));
  
  // Label at midpoint
  const mid = tp1off.clone().add(tp2off).multiplyScalar(0.5);
  const div = document.createElement('div');
  div.className = 'dim-label' + (cat ? ' cat-' + cat : '');
  div.textContent = label;
  const labelObj = new CSS2DObject(div);
  labelObj.position.copy(mid);
  group.add(labelObj);
}

// Helper: set visibility on group AND traverse to set CSS2DObject children
// (CSS2DObject does not inherit parent visibility in Three.js)
function setGroupVisible(group, visible) {
  group.visible = visible;
  group.traverse((obj) => {
    if (obj.isCSS2DObject) {
      obj.visible = visible;  // CSS2DRenderer checks this per-object, ignores parent visibility
      obj.element.style.display = visible ? '' : 'none';
    }
  });
}

    setGroupVisible(groupCutout, !zclEnabled);
    setGroupVisible(groupCutoutZCL, zclEnabled);
  } else {
    setGroupVisible(groupCutout, false);
    setGroupVisible(groupCutoutZCL, false);
  }
});

// === CAMERA PRESETS — using standard Three.js convention ===
// SCAD y=350 (mid-depth) → three z = -0.35 (away from viewer, into screen)
// Camera "front" at +z (toward viewer, looking at lamellfasad)
window.resetCamera = function(preset) {
  if (preset === 'iso') {
    camera.position.set(5.5, 3, 4);     // right + up + front
  } else if (preset === 'front') {
    camera.position.set(1.65, 1.0, 4.5); // straight in front
  } else if (preset === 'back') {
    camera.position.set(1.65, 1.0, -4.5); // behind kitchen (mot uthus)
  } else if (preset === 'top') {
    camera.position.set(1.65, 6, -0.35); // directly above
  } else if (preset === 'right') {
    camera.position.set(7, 1.5, -0.35);  // beyond gavel (right)
  } else if (preset === 'left') {
    camera.position.set(-4, 1.5, -0.35); // beyond husvägg (left)
  }
  controls.target.set(1.65, 0.5, -0.35); // target at center mid-depth
  controls.update();
};
resetCamera('iso');

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
